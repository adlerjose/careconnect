services:
  postgres:
    image: postgres:16-alpine
    container_name: careconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careconnect_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-careconnect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careconnect} -d ${POSTGRES_DB:-careconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - careconnect-net

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: careconnect-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque_esta_chave_em_producao}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-careconnect}:${POSTGRES_PASSWORD:-careconnect_dev_pwd}@postgres:5432/${POSTGRES_DB:-careconnect}?schema=evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR
      LOG_BAILEYS: error
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:8000/webhook/whatsapp
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    ports:
      - "${EVOLUTION_API_PORT:-8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - careconnect-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-careconnect}:${POSTGRES_PASSWORD:-careconnect_dev_pwd}@postgres:5432/${POSTGRES_DB:-careconnect}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque_esta_chave_em_producao}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/app:cached
    networks:
      - careconnect-net

volumes:
  postgres_data:
  evolution_instances:

networks:
  careconnect-net:
    driver: bridge
